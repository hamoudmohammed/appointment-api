services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: appointment-api
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - ADMIN_API_KEY=${ADMIN_API_KEY:-}
      - BUSINESS_HOURS_START=${BUSINESS_HOURS_START:-08:00}
      - BUSINESS_HOURS_END=${BUSINESS_HOURS_END:-17:00}
      - SLOT_DURATION_MINUTES=${SLOT_DURATION_MINUTES:-30}
      - PREVENT_PAST_BOOKING=${PREVENT_PAST_BOOKING:-false}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=appointments_db
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: appointment-db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=appointments_db
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./src/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d appointments_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
